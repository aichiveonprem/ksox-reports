<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONTEC · 비공개 보고 자료</title>
<style>
:root{--ink:#14213D;--body:#33405C;--muted:#73819F;--accent:#4F46E5;--accent-2:#4338CA;--soft:#F4F7FB;--line:#E3E9F2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:radial-gradient(900px 460px at 80% 0%,#EEF2FF 0%,transparent 60%),linear-gradient(180deg,#FFFFFF 0%,var(--soft) 100%);color:var(--body);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{width:min(560px,100%)}
.brand{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.22em;color:var(--accent-2);text-transform:uppercase;margin-bottom:14px}
h1{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-bottom:8px}
p.lead{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:26px}
.list{display:flex;flex-direction:column;gap:14px}
a.item{display:flex;align-items:center;gap:16px;padding:20px 22px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(20,33,61,.06);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
a.item:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 14px 30px rgba(79,70,229,.12)}
.ic{flex:0 0 auto;width:42px;height:42px;border-radius:10px;background:#EEF2FF;color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tx{flex:1 1 auto;min-width:0}
.tx .tt{font-size:16px;font-weight:700;color:var(--ink)}
.tx .ds{font-size:13px;color:var(--muted);margin-top:3px}
.tx .meta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--accent-2);margin-top:5px;letter-spacing:.04em}
.arr{flex:0 0 auto;color:var(--muted);font-size:18px}
.foot{font-size:12px;color:var(--muted);margin-top:28px;text-align:center;line-height:1.6}
.foot b{color:var(--ink);font-weight:600}
</style></head>
<body>
<div class="wrap">
  <div class="brand">CONTEC · 비공개 보고 자료</div>

  <div class="list">
    <a class="item" href="k-sox.html">

      <div class="tx">

        <div class="meta">2026.06.12 · v1.0</div>
      </div>
      <div class="arr">→</div>
    </a>
    <a class="item" href="converse.html">

      </div>
      <div class="arr">→</div>
    </a>
  </div>
  <div class="foot">접근 PIN 은 별도 채널로 안내됩니다.<br>PIN 없이는 본문이 노출되지 않습니다.</div>
</div>
</body></html>
